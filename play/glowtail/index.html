    <p class="record" id="record" aria-live="polite"></p>

    <p class="keys">Swipe, arrow keys, WASD or a gamepad. P to pause.</p>
    <a class="back" href="/">Magestican Studios</a>
  </section>

  <div id="hud" hidden>
    <div class="chip"><div id="score">0</div><div id="best">Best 0</div></div>
    <div class="right">
      <div class="chip"><div id="depth">1. Shallows</div><div id="quotaWrap"><div id="quota"></div><div id="quotaText">0 / 8</div></div></div>
      <button id="pauseBtn" aria-label="Pause">II</button>
    </div>
  </div>
  <div id="banner"><div id="bannerBig"></div><div id="bannerSmall"></div></div>
  <div id="pops"></div>

  <section id="pause" class="screen" hidden>
    <h2 id="overTitle2" style="margin:0;font:900 48px/1 var(--display)">Paused</h2>
    <button class="big" id="resume">Resume</button>
    <button class="ghost" id="quit">Quit to menu (ends this run)</button>
    <button class="ghost soundToggle" aria-pressed="true">Sound on</button>
  </section>

    <h2 id="overTitle">Lights out</h2>
    <div id="overScore">0</div>
    <p class="stat" id="overBest"></p>
    <p class="stat" id="overDepth"></p>
    <p class="stat" id="overChain"></p>
    <button class="big" id="again">Dive again</button>
    <button class="ghost" id="menu">Menu</button>
  </section>
