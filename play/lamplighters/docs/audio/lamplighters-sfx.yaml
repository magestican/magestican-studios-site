      - {type: sample, pick: "sonniss26-east-coast-america:*Lightbulb*", slices: true, at_ms: 0, ms: 150, gain_db: -5, fade_ms: 30}
      - {type: click, at_ms: 150, ms: 3, highpass_hz: 2000, gain_db: -10}
      - {type: sample, pick: "sonniss26-east-coast-america:*Lightbulb*", slices: true, offset: 1, at_ms: 260, ms: 90, gain_db: -5, fade_ms: 20}
      - {type: click, at_ms: 350, ms: 3, highpass_hz: 2000, gain_db: -10}
      - {type: sample, pick: "sonniss26-thermometer:*ELECEmf*", at_ms: 360, ms: 120, gain_db: -9, fade_ms: 50}
      - {type: sample, pick: "sonniss26-east-coast-america:*Lightbulb*", slices: true, offset: 2, at_ms: 520, ms: 380, gain_db: -4, fade_in_ms: 20, fade_ms: 200}
