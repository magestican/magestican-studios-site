<!doctype html>
<html lang="en">
  <head>
  <meta name="robots" content="noindex">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Space 95</title>
    <meta name="description" content="Space 95: two friends on a 9-to-5 survey job on the giant planet Galaxa Z. Early movement test build." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/game.css?v=d2a9e9bb-20261020T124626Z" />
    <link rel="stylesheet" href="css/timesheet.css?v=d2a9e9bb-20261020T124626Z" />
    <link rel="stylesheet" href="css/title.css?v=d2a9e9bb-20261020T124626Z" />
    <link rel="stylesheet" href="css/bolt.css?v=d2a9e9bb-20261020T124626Z" />
    <script type="importmap">
      { "imports": { "three": "./js/vendor/three/three.module.js" } }
    </script>
    <link rel="canonical" href="https://magesticanstudios.com/play/space-95/">
</head>
  <body>
    <canvas id="stage" aria-label="Space 95 game view"></canvas>
    <div id="hud" class="hud" aria-live="polite"></div>
    <div id="bolt" class="bolt-say hud-card" role="status" hidden></div>
    <div id="timesheet" class="timesheet"></div>
    <div id="pause" class="timesheet" hidden></div>
    <button id="pause-btn" class="pause-btn" type="button" aria-label="Pause">II</button>
    <div id="title" class="title" hidden></div>
    <div class="help hud-card" id="help">
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> run</span>
      <span><kbd>Space</kbd> jump (hold = higher)</span>
      <span><kbd>&darr;</kbd> fast fall</span>
      <span><kbd>R</kbd> retry</span>
      <span><kbd>M</kbd> sound</span>
      <span><kbd>Esc</kbd> pause</span>
      <span class="help-dash" hidden><kbd>Shift</kbd> dash</span>
      <span class="help-tether" hidden><kbd>K</kbd> hook</span>
    </div>
    <div class="touch" aria-hidden="true">
      <div class="touch-stick" data-touch="stick"><div class="touch-knob" data-touch="knob"></div></div>
      <button class="touch-jump" data-touch="jump" type="button">Jump</button>
      <button class="touch-dash" data-touch="dash" type="button" hidden>Dash</button>
      <button class="touch-tether" data-touch="tether" type="button" hidden>Hook</button>
    </div>
    <noscript>Space 95 needs JavaScript.</noscript>
    <script type="module" src="js/main.js?v=d2a9e9bb-20261020T124626Z"></script>
  </body>
</html>
