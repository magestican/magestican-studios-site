<body>
  <header>
    <h1>2D Fighter EX</h1>
    <p>EX is for experiment. Two minutes of fight, animated at 30fps from hand-built poses.</p>
  </header>

  <div class="frame">
    <canvas id="stage" width="502" height="271" aria-label="A two-fighter animation drawn in coloured blocks"></canvas>
  </div>

  <div class="controls">
    <button id="playpause" aria-pressed="false">Pause</button>
    <button id="step">Step</button>
    <button id="reseed">New forest</button>
    <label>Speed
      <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1">
      <span id="speedout">1.00x</span>
    </label>
  </div>

  








  <details class="more" id="more" open>
    <summary>Options</summary>

  




  <div class="controls" id="fxbar">
    <label>Fighter 1
      <select id="castA"></select>
    </label>
    <label>Fighter 2
      <select id="castB"></select>
    </label>
    <label>World
      <select id="world">
        <option value="">Trackside street</option>
        <option value="feudal">Feudal Japan</option>
        <option value="neon">Neon future</option>
        <option value="waste">Wasteland</option>
      </select>
    </label>
    <label>Season
      <select id="season">
        <option value="spring">Sakura</option>
        <option value="winter">Snowfall</option>
      </select>
    </label>
    <label>Mood
      <select id="mood">
        <option value="none">As measured</option>
        <option value="dark">Darker</option>
        <option value="juvenile">Juvenile</option>
        <option value="angry">Angry</option>
      </select>
    </label>
    <label><input type="checkbox" id="fxShadow" checked> Shadows</label>
    <label><input type="checkbox" id="fxWeather" checked> Weather</label>
    <label><input type="checkbox" id="fxImpact" checked> Impact FX</label>
    <label><input type="checkbox" id="fxWords" checked> Sound words</label>
  </div>

  <div class="readout">
    <span>frame <b id="frame">1</b>/<b id="frames">-</b></span>
    <span><b id="clock">0.00s</b></span>
    <span>beat <b id="beat">-</b></span>
    <span>seed <b id="seed">-</b></span>
  </div>

  


  </details>

  <div class="readout" id="account"></div>

  <footer>
    <p>Space to play or pause. Arrow keys to step.<br>
    <a href="../../2d-fighter-ex.html">What this is</a> &middot;
    <a href="../../">Magestican Studios</a></p>
  </footer>
