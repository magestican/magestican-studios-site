# dj sfx-set brief - Kartzoom (games/farmykart), 2026-11-19, task KZ-AAA-3. Run from projects/magestican-dj:
#   .venv/Scripts/python -m studio.cli sfx-set <this file> --no-deliver
#   then: python docs/audio/deliver.py E:/magestican-dj/renders/kartzoom-sfx games/farmykart/assets/sfx
# Bryan, 2026-11-18: "I asked you for a second part to make it look awesome and Aaa" (he chose upgrading the live
# game); 2026-11-09: "every game needs unique music sound menus etc. Make it a hard rule forever".
# The fantasy (docs/design/DOSSIER.md): "A cow, a pig or a chicken in a go-kart, drifting through a muddy farm
# circuit with a cowpat ready for the leader." So the palette is FARMYARD JUNK: tin buckets and milk churns, a
# cowbell, a bulb horn, a wooden crate, wet mud and cowpats, hay and seed tins, a farm-gate rail, and the animals'
# own voices for the emotes (a lowing moo, a snorting oink, a clucking chicken). Never a sci-fi blip, never a
# "piece on a table". Fully synthesised (tone, noise, modal, grains, impact, formant voices): no sample family
# another game picks for the same role (scripts/audioUnique.test.mjs). Key: G major (G A B D E), the bells and
# tonal stingers sit in it. Levels: the engine (runtime synth) and the music run under everything, so hits and
# pickups sit on top and the per-lap furniture (bump, land) sits low.
out_root: E:/magestican-dj/renders/kartzoom-sfx
